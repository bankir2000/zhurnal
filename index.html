<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пошук у чаті WhatsApp</title>
<meta name="theme-color" content="#3b4728">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f1efe6;--card:#ffffff;--ink:#111309;--mut:#43463a;--line:#8f8d79;--a:#8f3f00;--aSoft:#fff0cf;--b:#0b4f7a;--bSoft:#dcefff;--btn:#2f3a1d;--btnT:#ffffff;--fbg:#ffffff;--fbd:#5c5b4a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e100b;--card:#1b1e15;--ink:#fbfaf2;--mut:#c4c7b6;--line:#656a57;--a:#ffb35c;--aSoft:#33260f;--b:#8fd0ff;--bSoft:#102535;--btn:#c3d89c;--btnT:#10130a;--fbg:#07080a;--fbd:#9da28c}}
:root[data-theme=dark]{--bg:#0e100b;--card:#1b1e15;--ink:#fbfaf2;--mut:#c4c7b6;--line:#656a57;--a:#ffb35c;--aSoft:#33260f;--b:#8fd0ff;--bSoft:#102535;--btn:#c3d89c;--btnT:#10130a;--fbg:#07080a;--fbd:#9da28c}
:root[data-theme=light]{--bg:#f1efe6;--card:#ffffff;--ink:#111309;--mut:#43463a;--line:#8f8d79;--a:#8f3f00;--aSoft:#fff0cf;--b:#0b4f7a;--bSoft:#dcefff;--btn:#2f3a1d;--btnT:#ffffff;--fbg:#ffffff;--fbd:#5c5b4a}
*{box-sizing:border-box}
:root{color-scheme:light dark}:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
.card.sp{border-color:var(--btn)}.sp h2{background:var(--btn);color:var(--btnT)}
#per .row>.g{flex:1 1 40%}
html{padding-top:env(safe-area-inset-top,0);font-size:18px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media(min-width:700px){html{font-size:20px}}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
main{max-width:820px;margin:0 auto;padding:12px}
h1{font-size:1.5rem;margin:4px 0 8px}
.sub{color:var(--mut);font-size:.95rem;margin:0 0 10px;overflow-wrap:anywhere}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;min-height:44px;cursor:pointer;font-weight:600}
button.p,.btn.p{background:var(--btn);color:var(--btnT);border-color:var(--btn)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--b);outline-offset:1px}
textarea{resize:vertical;line-height:1.35}
input[type=text],input[type=date],textarea,select{font:inherit;width:100%;padding:10px 12px;border:2px solid var(--fbd);border-radius:8px;background:var(--fbg);color:var(--ink)}
::placeholder{color:var(--mut);opacity:.85}
select{min-height:48px}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin:14px 0;overflow:hidden}
.card.s0{border-color:var(--a)}.card.s1{border-color:var(--b)}
.card h2{font-size:1.25rem;margin:-12px -12px 12px;padding:10px 14px;color:var(--bg)}
.s0 h2{background:var(--a)}.s1 h2{background:var(--b)}
.lnk{color:var(--ink);font-weight:600;margin:0 0 6px}
.card .row>.g{flex:1 1 100%}.card .row>button{flex:1 1 40%}
.btn.big{display:block;text-align:center;font-size:1.15rem;padding:14px;min-height:54px;margin:8px 0}
.tools>*{flex:1}
#fileInfo{color:var(--ink);font-weight:600}
h1{border-bottom:4px solid var(--btn);padding-bottom:6px}
.item .t b{font-size:1.1rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.row>*{flex:0 0 auto}.row>.g{flex:1 1 140px}
label.f{display:block;font-size:.95rem;color:var(--mut);font-weight:600;margin:10px 0 4px}
.tabs{display:flex;gap:6px;margin:12px 0 6px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.tabs button{flex:1;padding:10px 4px;font-size:1rem;min-height:48px}
.tabs button[aria-selected=true]{background:var(--btn);color:var(--btnT);border-color:var(--btn);font-weight:700}
.tabs button.t0[aria-selected=true]{background:var(--a);border-color:var(--a);color:var(--bg)}
.tabs button.t1[aria-selected=true]{background:var(--b);border-color:var(--b);color:var(--bg)}
.tabs button.t0{border-bottom:4px solid var(--a)}.tabs button.t1{border-bottom:4px solid var(--b)}
.msg{background:var(--card);border:1px solid var(--line);border-left-width:7px;border-radius:10px;padding:10px 12px;margin:9px 0}
.msg.q0{border-left-color:var(--a);background:var(--aSoft)}
.msg.q1{border-left-color:var(--b);background:var(--bSoft)}
.msg.sys{background:transparent;border-style:dashed;color:var(--mut);font-size:.95rem}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.meta .who{font-weight:800;font-size:1.1rem;flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
.stamp{font-weight:800;font-size:1rem;font-variant-numeric:tabular-nums;border-radius:6px;padding:2px 8px;background:var(--bg);border:1px solid var(--line)}
.q0 .stamp{background:var(--a);border-color:var(--a);color:var(--bg)}
.q1 .stamp{background:var(--b);border-color:var(--b);color:var(--bg)}
.sys .stamp{font-weight:600;color:var(--mut)}
.day{position:sticky;top:var(--tabh,56px);z-index:1;margin:14px 0 2px;padding:5px 12px;font-weight:800;font-size:1.05rem;border-radius:6px;background:var(--ink);color:var(--bg);width:max-content;max-width:100%}
.body{white-space:pre-wrap;word-break:break-word;font-size:1.15rem;line-height:1.6}
mark{border-radius:3px;padding:0 3px;font-weight:800}
mark.m0{background:#ffd23f;color:#141000;box-shadow:0 0 0 2px #b36b00}mark.m1{background:#86d4ff;color:#001622;box-shadow:0 0 0 2px #0b5f93}
.info{color:var(--mut);font-size:.95rem;margin:6px 0}
details{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0}
summary{cursor:pointer;font-weight:700;font-size:1.05rem;min-height:36px}
.item{display:flex;gap:6px;align-items:center;padding:9px 0;border-top:2px solid var(--line);flex-wrap:wrap}
.item .t{flex:1 1 150px;min-width:0}.item .t small{display:block;color:var(--mut);font-size:.95rem;overflow-wrap:anywhere}
.item button{padding:6px 12px}
.snd{margin-top:12px;background:var(--fbg);border-color:var(--fbd)}
.snd summary{font-weight:600;color:var(--a)}
.sl{max-height:240px;overflow:auto;margin-top:6px}
.sr{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.sr input{width:26px;height:26px;flex:0 0 auto;accent-color:var(--a)}
.sr span{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.sr small{color:var(--mut);margin-left:auto}
.hide{display:none}
@media(prefers-reduced-motion:no-preference){button{transition:filter .1s}button:active{filter:brightness(.9)}}
</style></head>
<body><main>
<h1>Пошук у чаті WhatsApp</h1>
<p class="sub" id="fileInfo">Файл ще не завантажено.</p>
<label class="btn p big">Відкрити чат (.txt)<input id="file" type="file" accept=".txt,text/plain" class="hide"></label>
<div class="row tools" style="margin-top:0"><button id="fm" aria-label="Менший текст">A−</button><button id="fp" aria-label="Більший текст">A+</button><button id="th">Тема</button></div>

<div id="slots"></div>

<section class="card sp" id="per"><h2>Період</h2>
  <div class="row" style="margin-top:0"><div class="g"><label class="f" for="pf" style="margin-top:0">Від</label><input type="date" id="pf"></div><div class="g"><label class="f" for="pt" style="margin-top:0">До</label><input type="date" id="pt"></div></div>
  <div class="row"><button data-per="day">Останній день</button><button data-per="7">7 днів</button><button data-per="30">30 днів</button><button data-per="all">Весь час</button></div>
  <div class="info" id="perInfo"></div>
</section>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="info" id="stat"></div>
<div class="row" id="expRow" style="margin:0 0 6px"><span class="info" style="margin:0">Зберегти в HTML:</span><button data-ex="0">Пошук 1</button><button data-ex="1">Пошук 2</button><button data-ex="both">Обидва</button></div>
<div id="out"></div>
<div class="row"><button id="more" class="hide">Показати ще</button></div>

<details id="libBox"><summary>Довідник пошуків</summary>
  <div id="lib"></div>
  <div class="row">
    <button id="exp" class="p">Експорт</button>
    <label class="btn">Імпорт<input id="imp" type="file" accept=".json,application/json" class="hide"></label>
  </div>
  <label class="f" for="ta">Якщо файл не зберігається — скопіюйте текст звідси або вставте сюди й натисніть «Імпорт тексту»</label>
  <textarea id="ta" rows="3"></textarea>
  <div class="row"><button id="impT">Імпорт тексту</button></div>
</details>
</main>
<script>
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const IDB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('wa_search',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error)})}
};
let msgs=[],view=0,limit=200,chatName='';
let period=LS.get('wa_period',{from:'',to:''});
const isoK=d=>{const p=d.split('.');const y=p[2].length===2?'20'+p[2]:p[2];return y+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0')};
const fmtK=k=>k?k.slice(8)+'.'+k.slice(5,7)+'.'+k.slice(2,4):'';
const inPeriod=m=>(!period.from||m.k>=period.from)&&(!period.to||m.k<=period.to);
function perText(){return (period.from||period.to)?(fmtK(period.from)||'…')+' — '+(fmtK(period.to)||'…'):''}
const DEF=[{name:'',words:'АРБА спочинь гот "ПТ +" "ВПТ +" готовність відбій',mode:'any',senders:[],sf:''},{name:'',words:'МВГ Сокіл-78',mode:'all',senders:[],sf:''}];
let slots=LS.get('wa_slots_v2',JSON.parse(JSON.stringify(DEF)));
let lib=LS.get('wa_lib',[]);
const FIELDS=['name','words','mode','senders','sf'];
const newId=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
lib.forEach(e=>{if(!e.id)e.id=newId()});
function libOf(i){return slots[i].link?lib.find(e=>e.id===slots[i].link)||null:null}
function pullSlot(i){const e=libOf(i);if(!e){slots[i].link=null;return}FIELDS.forEach(k=>slots[i][k]=Array.isArray(e[k])?e[k].slice():(e[k]===undefined?'':e[k]))}
function pushSlot(i){const e=libOf(i);if(!e)return;const x=slots[i];e.name=x.name||x.words.slice(0,40);e.words=x.words;e.mode=x.mode;e.senders=(x.senders||[]).slice();e.sf=x.sf||''}
function linkText(i){return libOf(i)?'🔗 Зберігається в довіднику автоматично':'Не пов’язано з довідником (введіть слова — запис створиться сам)'}
function ensureLink(i){
  if(libOf(i))return false;
  const x=slots[i];if(!terms(x.words).length&&!hasSender(x))return false;
  const name=x.name||x.words.slice(0,40);
  let e=lib.find(y=>y.name===name&&y.words===x.words&&y.mode===x.mode&&(y.sf||'')===(x.sf||'')&&slots[1-i].link!==y.id);
  if(!e){e={id:newId()};lib.push(e)}
  x.link=e.id;pushSlot(i);return true;
}
function syncSlot(i){
  if(libOf(i))pushSlot(i);else if(!ensureLink(i)){return}
  renderLib();const el=$('lk'+i);if(el)el.textContent=linkText(i);
}
function linkSlot(j,id){const o=1-j;if(slots[o].link===id)slots[o].link=null;slots[j].link=id;pullSlot(j)}
const norm=s=>s.toLowerCase().replace(/[’ʼ`‘]/g,"'");
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

function parse(txt){
  const re=/^(\d{1,2}\.\d{1,2}\.\d{2,4}),? (\d{1,2}:\d{2})(?::\d{2})? - ([\s\S]*)$/;
  const out=[];let cur=null;
  for(let line of txt.replace(/[\u200e\u200f\u202f]/g,' ').replace(/\r/g,'').split('\n')){
    const m=re.exec(line);
    if(m){
      const r=m[3],i=r.indexOf(': ');
      cur=(i>0&&i<70)?{d:m[1],t:m[2],s:r.slice(0,i),x:r.slice(i+2),sys:0}:{d:m[1],t:m[2],s:'',x:r,sys:1};
      out.push(cur);
    }else if(cur){cur.x+='\n'+line}
  }
  out.forEach(m=>{m.n=norm(m.x);m.k=isoK(m.d)});
  return out;
}
function terms(w){
  const r=[];w.replace(/,/g,' ').replace(/["“«]([^"”»]+)["”»]|(\S+)/g,(_,a,b)=>{const t=norm((a||b).trim());if(t)r.push(t)});
  return r;
}
function frags(sl){return (sl.sf||'').split(/[,;\n]/).map(x=>norm(x.trim())).filter(Boolean)}
function hasSender(sl){return (sl.senders||[]).length>0||frags(sl).length>0}
function matches(m,sl){
  if(!inPeriod(m))return false;
  const sn=sl.senders||[],fr=frags(sl),hs=sn.length>0||fr.length>0;
  if(hs){
    if(m.sys)return false;
    const who=norm(m.s);
    if(!(sn.includes(m.s)||fr.some(f=>who.includes(f))))return false;
  }
  const t=terms(sl.words);
  if(!t.length)return hs;
  return sl.mode==='any'?t.some(x=>m.n.includes(x)):t.every(x=>m.n.includes(x));
}
let SNDN=[];
function sumText(i){
  const sn=slots[i].senders||[];
  return 'Від кого: '+(!sn.length?'усі':sn.length<=2?sn.join(', '):'обрано '+sn.length);
}
function sndUI(i){
  const cnt={};msgs.forEach(m=>{if(!m.sys)cnt[m.s]=(cnt[m.s]||0)+1});
  const sel=slots[i].senders||[];
  sel.forEach(n=>{if(!(n in cnt))cnt[n]=0});
  SNDN=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x]);
  const ea=x=>esc(x).replace(/"/g,'&quot;');
  return `<label class="f" for="sf${i}">Відправник вручну (ім'я чи номер, через кому)</label>
    <input type="text" id="sf${i}" list="dl${i}" value="${ea(slots[i].sf||'')}" placeholder="Напр. Ворскла, 3734" data-i="${i}" data-k="sf" autocomplete="off">
    <datalist id="dl${i}">${SNDN.map(n=>`<option value="${ea(n)}">`).join('')}</datalist>
    <details class="snd"><summary id="sndSum${i}">${esc(sumText(i))}</summary>
    <div class="row"><button data-sall="${i}">Скинути відправників</button></div>
    <div class="sl">${SNDN.map((n,k)=>`<label class="sr"><input type="checkbox" data-snd="${i}" value="${k}"${sel.includes(n)?' checked':''}><span>${esc(n)}</span><small>${cnt[n]}</small></label>`).join('')||'<p class="info">Відкрийте чат, щоб побачити відправників.</p>'}</div></details>`;
}
function hl(text,idx){
  const t=terms(slots[idx].words);if(!t.length)return esc(text);
  const re=new RegExp(t.map(reEsc).join('|').replace(/'/g,"['’ʼ`‘]"),'gi');
  let o='',p=0,m;
  while((m=re.exec(text))){if(!m[0])break;o+=esc(text.slice(p,m.index))+'<mark class="m'+idx+'">'+esc(m[0])+'</mark>';p=m.index+m[0].length}
  return o+esc(text.slice(p));
}

function renderSlots(){
  $('slots').innerHTML=[0,1].map(i=>`
  <section class="card s${i}"><h2>Пошук ${i+1}</h2>
    <div class="info lnk" id="lk${i}">${linkText(i)}</div>
    <label class="f" for="nm${i}">Назва</label>
    <input type="text" id="nm${i}" value="${esc(slots[i].name)}" placeholder="Напр. «Дрони Полтавщина»" data-i="${i}" data-k="name">
    <label class="f" for="w${i}">Слова (через пробіл або кому; фраза — в лапках)</label>
    <textarea id="w${i}" rows="3" placeholder="Напр. Котельва шахед «озкб»" data-i="${i}" data-k="words" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(slots[i].words)}</textarea>
    <div class="row">
      <select class="g" id="md${i}" data-i="${i}" data-k="mode" aria-label="Режим">
        <option value="all"${slots[i].mode==='all'?' selected':''}>Усі слова в повідомленні</option>
        <option value="any"${slots[i].mode==='any'?' selected':''}>Будь-яке зі слів</option>
      </select>
      <button data-save="${i}">У довідник</button>
      <button data-clear="${i}">Очистити</button>
    </div>
    ${i===0?sndUI(0):''}
  </section>`).join('');
}
function renderTabs(){
  const c=[0,1].map(i=>msgs.filter(m=>matches(m,slots[i])).length);
  const names=['Пошук 1 ('+c[0]+')','Пошук 2 ('+c[1]+')','Весь чат'];
  $('tabs').innerHTML=names.map((n,i)=>`<button role="tab" class="t${i}" aria-selected="${view===i}" data-v="${i}">${n}</button>`).join('');
}
function renderList(){
  const o=$('out');
  if(!msgs.length){o.innerHTML='';$('stat').textContent='Відкрийте експортований .txt файл чату.';$('more').classList.add('hide');return}
  let list;
  if(view===2)list=msgs.filter(inPeriod);
  else{
    if(!terms(slots[view].words).length&&!hasSender(slots[view])){o.innerHTML='';$('stat').textContent='Введіть слова для пошуку '+(view+1)+'.';$('more').classList.add('hide');return}
    list=msgs.filter(m=>matches(m,slots[view]));
  }
  $('stat').textContent='Знайдено повідомлень: '+list.length+(view<2&&slots[view].name?' · '+slots[view].name:'')+(perText()?' · період '+perText():'');
  const show=list.slice(0,limit);
  let last='';
  o.innerHTML=show.map(m=>{
    let h='';
    if(m.d!==last){last=m.d;h='<div class="day">'+m.d+'</div>'}
    return h+`<article class="msg${view<2?' q'+view:''}${m.sys?' sys':''}"><div class="meta"><span class="stamp">${m.d} · ${m.t}</span><span class="who">${esc(m.s||'Системне')}</span></div><div class="body">${view<2?hl(m.x,view):esc(m.x)}</div></article>`}).join('')
    ||'<p class="info">Нічого не знайдено.</p>';
  $('more').classList.toggle('hide',list.length<=limit);
}
function renderLib(){
  $('lib').innerHTML=lib.length?lib.map((e,i)=>`<div class="item"><div class="t"><b>${esc(e.name||'Без назви')}${slots.map((x,k)=>x.link===e.id?' 🔗'+(k+1):'').join('')}</b><small>${esc(e.words)} · ${e.mode==='any'?'будь-яке':'усі'}${(e.senders&&e.senders.length)||e.sf?' · від: '+esc([...(e.senders||[]),e.sf||''].filter(Boolean).join(', ')):''}</small></div>
    <button data-load="${i},0">→ 1</button><button data-load="${i},1">→ 2</button><button data-del="${i}" aria-label="Видалити">✕</button></div>`).join('')
    :'<p class="info">Довідник порожній. Натисніть «У довідник» біля пошуку.</p>';
}
function refresh(){renderTabs();renderList();if(typeof fixTabH==='function')fixTabH()}
function persist(){LS.set('wa_slots_v2',slots);LS.set('wa_lib',lib)}

document.addEventListener('input',e=>{
  const d=e.target.dataset;if(d.i===undefined)return;
  slots[+d.i][d.k]=e.target.value;syncSlot(+d.i);persist();limit=200;
  if(d.k!=='name'){view=+d.i;refresh()}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.v!==undefined){view=+d.v;limit=200;refresh()}
  else if(d.per!==undefined){
    const r=chatRange(),last=r?r[1]:new Date().toISOString().slice(0,10);
    if(d.per==='all')setPeriod('','');else if(d.per==='day')setPeriod(last,last);else setPeriod(addDays(last,-(+d.per-1)),last);
  }
  else if(d.ex!==undefined)exportHTML(d.ex==='both'?'both':+d.ex);
  else if(d.save!==undefined){
    const i=+d.save,x=slots[i];if(!terms(x.words).length&&!hasSender(x)){alert('Спочатку введіть слова або оберіть відправників.');return}
    const name=x.name||x.words.slice(0,40);
    let e=libOf(i)||lib.find(y=>y.name===name&&y.words===x.words);
    if(!e){e={id:newId()};lib.push(e)}
    slots[1-i].link===e.id&&(slots[1-i].link=null);
    x.link=e.id;pushSlot(i);
    persist();renderLib();renderSlots();$('libBox').open=true;
  }
  else if(d.sall!==undefined){const i=+d.sall;slots[i].senders=[];slots[i].sf='';if($('sf'+i))$('sf'+i).value='';document.querySelectorAll('[data-snd="'+i+'"]').forEach(c=>c.checked=false);$('sndSum'+i).textContent=sumText(i);syncSlot(i);view=i;limit=200;persist();refresh()}
  else if(d.clear!==undefined){slots[+d.clear]={name:'',words:'',mode:'all',senders:[],sf:'',link:null};persist();renderLib();renderSlots();refresh()}
  else if(d.load!==undefined){const [i,j]=d.load.split(',').map(Number);slots[j]={name:'',words:'',mode:'all',senders:[],sf:'',link:null};linkSlot(j,lib[i].id);renderLib();view=j;limit=200;persist();renderSlots();refresh();scrollTo({top:0,behavior:'smooth'})}
  else if(d.del!==undefined){if(confirm('Видалити з довідника?')){const id=lib[+d.del].id;slots.forEach(x=>{if(x.link===id)x.link=null});lib.splice(+d.del,1);persist();renderLib();renderSlots()}}
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.dataset.snd===undefined)return;
  const i=+t.dataset.snd,n=SNDN[+t.value];
  const a=slots[i].senders=slots[i].senders||[],k=a.indexOf(n);
  if(t.checked&&k<0)a.push(n);if(!t.checked&&k>=0)a.splice(k,1);
  syncSlot(i);persist();view=i;limit=200;$('sndSum'+i).textContent=sumText(i);refresh();
});
$('more').onclick=()=>{limit+=200;renderList()};
function chatRange(){if(!msgs.length)return null;let a=msgs[0].k,b=msgs[0].k;msgs.forEach(m=>{if(m.k<a)a=m.k;if(m.k>b)b=m.k});return [a,b]}
function renderPeriod(){
  $('pf').value=period.from;$('pt').value=period.to;
  const r=chatRange();if(r){$('pf').min=$('pt').min=r[0];$('pf').max=$('pt').max=r[1]}
  $('perInfo').textContent=perText()?'Фільтр: '+perText():'Увесь період'+(r?' ('+fmtK(r[0])+' — '+fmtK(r[1])+')':'');
}
function setPeriod(f,t){
  if(f&&t&&f>t)[f,t]=[t,f];
  period={from:f||'',to:t||''};LS.set('wa_period',period);limit=200;renderPeriod();refresh();
}
function addDays(k,n){const d=new Date(k+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
$('pf').onchange=()=>setPeriod($('pf').value,period.to);
$('pt').onchange=()=>setPeriod(period.from,$('pt').value);
const root=document.documentElement;
let fs=LS.get('wa_fs',0),th=LS.get('wa_theme','auto');
function fixTabH(){root.style.setProperty('--tabh',($('tabs').offsetHeight||56)+'px')}
function applyLook(){
  root.style.fontSize=fs?fs+'px':'';
  if(th==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',th);
  $('th').textContent='Тема: '+({auto:'авто',light:'світла',dark:'темна'}[th]);
  fixTabH();
}
function bump(d){const base=fs||Math.round(parseFloat(getComputedStyle(root).fontSize));fs=Math.max(14,Math.min(34,base+d));LS.set('wa_fs',fs);applyLook()}
$('fm').onclick=()=>bump(-2);$('fp').onclick=()=>bump(2);
$('th').onclick=()=>{th={auto:'light',light:'dark',dark:'auto'}[th];LS.set('wa_theme',th);applyLook()};
addEventListener('resize',fixTabH);

$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const txt=await f.text();msgs=parse(txt);chatName=f.name;
  if(!msgs.length){$('fileInfo').textContent='Не вдалося розпізнати повідомлення у файлі «'+f.name+'».';return}
  $('fileInfo').textContent=f.name+' · повідомлень: '+msgs.length+' · '+msgs[0].d+' — '+msgs[msgs.length-1].d;
  IDB.set('wa_chat',{name:f.name,txt}).catch(()=>alert('Не вдалося зберегти чат на пристрої — його доведеться відкривати знову.'));
  limit=200;renderSlots();renderPeriod();refresh();
};

function exportData(){return JSON.stringify({type:'wa-search-lib',v:2,items:lib,slots:slots.map(x=>({...x,link:undefined})),links:[slots[0].link||null,slots[1].link||null]},null,1)}
function exportHTML(which){
  if(!msgs.length){alert('Спочатку відкрийте чат.');return}
  const ids=which==='both'?[0,1]:[which];
  const body=ids.map(i=>{
    const sl=slots[i],fr=(sl.sf||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean);
    const snd=[...(sl.senders||[]),...fr];
    const head=`<section class="card s${i}"><h2>Пошук ${i+1}${sl.name?': '+esc(sl.name):''}</h2>
      <div class="info">Слова: ${esc(sl.words||'—')} (${sl.mode==='any'?'будь-яке зі слів':'усі слова'})${snd.length?'<br>Від кого: '+esc(snd.join(', ')):''}${perText()?'<br>Період: '+esc(perText()):''}</div>`;
    if(!terms(sl.words).length&&!hasSender(sl))return head+'<div class="info">Пошук порожній.</div></section>';
    const list=msgs.filter(m=>matches(m,sl));
    let last='';
    const items=list.map(m=>{
      let h='';if(m.d!==last){last=m.d;h='<div class="day">'+m.d+'</div>'}
      return h+`<article class="msg q${i}${m.sys?' sys':''}"><div class="meta"><span class="stamp">${m.d} · ${m.t}</span><span class="who">${esc(m.s||'Системне')}</span></div><div class="body">${hl(m.x,i)}</div></article>`;
    }).join('');
    return head+`<div class="info"><b>Знайдено повідомлень: ${list.length}</b></div></section>`+(items||'<p class="info">Нічого не знайдено.</p>');
  }).join('');
  const css=document.querySelector('style').textContent+'.day{top:0}';
  const when=new Date();
  const html='<!DOCTYPE html><html lang="uk" style="font-size:'+getComputedStyle(root).fontSize+'"'+(th==='auto'?'':' data-theme="'+th+'"')+'><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Результати пошуку</title><style>'+css+'</style></head><body><main><h1>Результати пошуку</h1><p class="sub">Чат: '+esc(chatName||'—')+' · створено '+esc(when.toLocaleString('uk-UA'))+'</p>'+body+'</main></body></html>';
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    a.download='rezultaty-poshuku-'+when.toISOString().slice(0,10)+(which==='both'?'':'-p'+(which+1))+'.html';
    document.body.appendChild(a);a.click();a.remove();
  }catch(err){alert('Не вдалося створити файл.')}
}
$('exp').onclick=()=>{
  const s=exportData();$('ta').value=s;
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));
    a.download='dovidnyk-poshukiv.json';document.body.appendChild(a);a.click();a.remove()}catch(err){}
};
function doImport(s){
  try{
    const j=JSON.parse(s);if(j.type!=='wa-search-lib'||!Array.isArray(j.items))throw 0;
    let n=0,u=0;const idMap={},res=[];
    j.items.forEach(x=>{
      if(!x||!(x.words||x.sf||(x.senders&&x.senders.length))){res.push(null);return}
      const it={name:x.name||'',words:x.words||'',mode:x.mode==='any'?'any':'all',senders:Array.isArray(x.senders)?x.senders:[],sf:x.sf||''};
      let e=x.id&&lib.find(y=>y.id===x.id);
      if(e){FIELDS.forEach(k=>e[k]=it[k]);u++}
      else{
        e=lib.find(y=>y.name===it.name&&y.words===it.words);
        if(!e){e={id:newId(),...it};lib.push(e);n++}
      }
      if(x.id)idMap[x.id]=e.id;res.push(e);
    });
    if(Array.isArray(j.slots)&&j.slots.length===2){
      j.slots.forEach((x,i)=>{
        let id=null;
        if(Array.isArray(j.links)&&j.links[i])id=idMap[j.links[i]]||null;
        else if(!Array.isArray(j.links)){const f=res.find(e=>e&&e.words===(x.words||'')&&(e.sf||'')===(x.sf||'')&&e.mode===(x.mode==='any'?'any':'all'));id=f?f.id:null}
        if(id)linkSlot(i,id);
        else slots[i]={name:x.name||'',words:x.words||'',mode:x.mode==='any'?'any':'all',senders:Array.isArray(x.senders)?x.senders:[],sf:x.sf||'',link:null};
      });
    }
    ensureLink(0);ensureLink(1);persist();renderLib();renderSlots();refresh();alert('Додано записів: '+n+', оновлено: '+u);
  }catch(err){alert('Невірний файл довідника.')}
}
$('imp').onchange=async e=>{const f=e.target.files[0];if(f)doImport(await f.text());e.target.value=''};
$('impT').onclick=()=>doImport($('ta').value);

(async function init(){
  [0,1].forEach(i=>{
    const x=slots[i];
    if(!x.link&&x.words){const f=lib.find(e=>e.words===x.words&&e.mode===x.mode&&(e.sf||'')===(x.sf||''));if(f&&slots[1-i].link!==f.id)x.link=f.id}
    pullSlot(i);
  });
  ensureLink(0);ensureLink(1);
  persist();
  applyLook();
  renderSlots();renderLib();
  let c=null;
  try{c=await IDB.get('wa_chat')}catch(e){}
  if(!c)c=LS.get('wa_chat',null);
  if(c&&c.txt){chatName=c.name;msgs=parse(c.txt);$('fileInfo').textContent=c.name+' · повідомлень: '+msgs.length+' (збережено на пристрої)';renderSlots()}
  renderPeriod();
  refresh();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script></body></html>
